# On every push: run the tests, then copy site/ to the gh-pages branch, which GitHub Pages serves.
name: Deploy site
on:
  push:
    branches: [krishna/eager-rubin-is48e3]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.js
      - run: git push -f origin "$(git subtree split --prefix site)":refs/heads/gh-pages
